server:
  port: 8080

spring:
  application:
    name: cinema-booking
  datasource:
    # url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cinema-booking}
    #   username: ${DB_USER:postgres}
    #   password: ${DB_PASSWORD:123456}
    url: ${SUPABASE_DB_URL}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # data.sql resets all booking data; only enable explicitly for disposable seed databases.
      mode: ${SPRING_SQL_INIT_MODE:never}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: si
      password: 1
  data:
    redis:
      # host: ${REDIS_HOST:localhost}
      # port: ${REDIS_PORT:6379}
      url: ${REDIS_URL}
      timeout: ${REDIS_TIMEOUT:5s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:10s}

seat-hold:
  ttl-minutes: 10
